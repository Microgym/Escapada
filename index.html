<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operación Escapada — Cristina & Pedro Edgar</title>
<style>
:root {
  --wine:#7f123d; --wine2:#9d1b52; --cream:#fff8eb; --paper:#f6ead2;
  --gold1:#f6e7aa; --gold2:#d7a946; --gold3:#b77c22; --ink:#2f2725;
}
*{box-sizing:border-box}
html,body{margin:0;background:#111;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:min(100vw,430px);min-height:100vh;background:#000;position:relative}
.screen{display:none;min-height:100vh;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
.screen.active{display:flex}
.poster{width:100%;height:auto;max-height:100vh;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.backBtn{
  position:absolute;left:12px;top:12px;z-index:40;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.72);background:rgba(67,31,35,.82);color:#fff;
  font-size:23px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)
}
.backBtn.hidden{display:none}
/* Scratch screen: standalone, so the destination can never leak before scratching */
#scratchScreen{
  background:
    radial-gradient(circle at 50% 15%, rgba(255,247,222,.94), rgba(245,222,180,.88) 38%, rgba(221,180,118,.92) 100%);
  padding:62px 20px 28px;color:var(--ink)
}
.scratchWrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
.kicker{color:var(--wine);font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.scratchTitle{font-family:Georgia,serif;font-size:31px;line-height:1.05;color:var(--wine);text-align:center;margin:0}
.scratchSub{font-family:Georgia,serif;font-size:17px;line-height:1.35;text-align:center;margin:0;color:#60483c}
.ticket{
  width:min(88vw,360px);aspect-ratio:1.38/1;position:relative;border-radius:24px;overflow:hidden;
  box-shadow:0 18px 48px rgba(67,41,20,.24);border:1px solid rgba(111,72,25,.22);
  background:#fffaf0
}
.destination{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:24px;text-align:center;background:linear-gradient(160deg,#fff9ef,#f4e4be)
}
.destination small{font:700 11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a17d3c}
.destination strong{font-family:Georgia,serif;color:var(--wine);font-size:29px;line-height:1.03;margin-top:10px}
.destination span{font-family:Georgia,serif;font-size:16px;margin-top:8px;color:#45332d}
.goldGrid{
  position:absolute;inset:0;z-index:10;display:grid;
  grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(12,1fr);
  touch-action:none;user-select:none;background:transparent
}
.goldCell{
  background:
    linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%),
    linear-gradient(155deg,var(--gold1),var(--gold2) 52%,var(--gold3));
  border:.25px solid rgba(255,255,255,.06);
  transition:opacity .08s linear
}
.goldLabel{
  position:absolute;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#6f4c14;text-align:center;pointer-events:none;font-family:Georgia,serif;
  text-shadow:0 1px 0 rgba(255,255,255,.35)
}
.goldLabel b{font-size:22px;display:block}
.goldLabel span{font-size:14px;display:block;margin-top:6px}
.scratchHint{font-size:14px;color:#6a5144;text-align:center;max-width:320px}
.scratchContinue{
  display:none;
  width:min(88vw,360px);
  min-height:52px;
  border:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--wine2),var(--wine));
  color:#fff;
  font-weight:700;
  letter-spacing:.08em;
  cursor:pointer;
  box-shadow:0 10px 26px rgba(85,22,51,.22);
}
.scratchContinue.show{display:block}


.scratchPoster{position:relative;width:100%;display:flex;justify-content:center}
.scratchPoster>.poster{width:100%;height:auto;display:block}
.scratchArea{
  position:absolute;
  left:6.5%; top:22.1%; width:87.9%; height:65.5%;
  border-radius:20px; overflow:hidden; z-index:8;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.destinationStyled{
  background:linear-gradient(160deg,#fff8ec,#f2dfb4);
  color:#71143d;
}
.destinationStyled small{color:#a37b35}
.goldGrid{background:transparent!important}
.goldLabel{
  color:#4d3210!important;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.goldLabel b{font-size:25px!important;font-weight:400!important}
.goldLabel span{font-size:17px!important;line-height:1.15}
.scratchContinue{
  position:absolute!important;
  left:17%!important; right:17%!important; bottom:3.8%!important;
  width:auto!important; z-index:20;
}

@media(min-width:700px){
  body{padding:20px 0}
  #app{min-height:auto;border-radius:26px;overflow:hidden;box-shadow:0 20px 70px #0008}
  .screen{min-height:auto}
}
</style>
</head>

<script>
(() => {
  const screens = [...document.querySelectorAll('.screen')];
  let step = 0;

  function resetScratch() {
    const grid = document.getElementById('goldGrid');
    const label = document.getElementById('goldLabel');
    [...grid.children].forEach(c => c.style.opacity = '1');
    grid.dataset.completed = '';
    label.style.display = 'block';
    scratchContinue.classList.remove('show');
  }

  function show(n) {
    step = Math.max(0, Math.min(n, screens.length - 1));
    screens.forEach((s,i) => s.classList.toggle('active', i === step));
    if (step === 5) resetScratch();
    window.scrollTo(0,0);
  }

  // Whole-screen tap advances on all non-scratch screens except the final one.
  [0,1,2,3,4,6,7].forEach(i => {
    screens[i].addEventListener('click', () => show(i + 1));
  });

  document.querySelectorAll('.backBtn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (step > 0) show(step - 1);
    });
  });

  // Build an opaque gold cover from real HTML cells, not canvas.
  const grid = document.getElementById('goldGrid');
  const label = document.getElementById('goldLabel');
  const scratchContinue = document.getElementById('scratchContinue');
  const cols = 18, rows = 12;
  for (let i = 0; i < cols * rows; i++) {
    const cell = document.createElement('div');
    cell.className = 'goldCell';
    cell.dataset.i = i;
    grid.appendChild(cell);
  }

  let scratching = false;
  const removed = new Set();

  function removeNear(clientX, clientY) {
    const r = grid.getBoundingClientRect();
    const x = clientX - r.left;
    const y = clientY - r.top;
    if (x < 0 || y < 0 || x > r.width || y > r.height) return;

    const cw = r.width / cols;
    const ch = r.height / rows;
    const cx = Math.floor(x / cw);
    const cy = Math.floor(y / ch);

    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const gx = cx + dx, gy = cy + dy;
        if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) continue;
        const idx = gy * cols + gx;
        const cell = grid.children[idx];
        if (cell && cell.style.opacity !== '0') {
          cell.style.opacity = '0';
          removed.add(idx);
        }
      }
    }

    if (removed.size > 12) label.style.display = 'none';
    if (removed.size > 82 && !grid.dataset.completed) {
      grid.dataset.completed = '1';
      scratchContinue.classList.add('show');
    }
  }

  grid.addEventListener('pointerdown', e => {
    scratching = true;
    grid.setPointerCapture?.(e.pointerId);
    removeNear(e.clientX, e.clientY);
    e.preventDefault();
  });
  grid.addEventListener('pointermove', e => {
    if (!scratching) return;
    removeNear(e.clientX, e.clientY);
    e.preventDefault();
  });
  grid.addEventListener('pointerup', e => {
    scratching = false;
    try { grid.releasePointerCapture?.(e.pointerId); } catch(_) {}
  });
  grid.addEventListener('pointercancel', () => scratching = false);

  scratchContinue.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    show(6);
  });
})();
</script>
